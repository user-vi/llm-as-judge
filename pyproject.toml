[project]
name = "n8n-pochta"
version = "0.1.0"
description = "Классификация емейлов"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dspy>=3.2.0,<4.0",          # GEPA-оптимизация промптов (не dspy-ai!)
    "pandas>=2.3.2,<3.0",
    "python-dotenv>=1.2.1",
    "openai>=2.8.1",
    "tqdm>=4.67.3",
    "litellm>=1.106.0",
    "scikit-learn>=1.5.0",
    "natasha>=1.6.0",
    "openpyxl>=3.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0.0",
    "ipykernel>=6.28.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# uv-специфичные настройки
dev-dependencies = [
    "ruff>=0.5.0",  # линтер/форматтер
]
